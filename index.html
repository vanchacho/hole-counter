<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ხვრელების მთვლელი</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root{--bg:#0d1410;--card:#15201a;--line:#24342a;--txt:#e8f1ea;--mut:#8aa293;--acc:#3ddc84;--warn:#ffb020;--bad:#ff5a5a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  h1 span{color:var(--acc)}
  .status{display:flex;gap:14px;font-size:13px;color:var(--mut);flex-wrap:wrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--acc)} .dot.wait{background:var(--warn)}
  main{max-width:980px;margin:0 auto;padding:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  h2{font-size:15px;margin:0 0 12px;color:var(--mut);font-weight:600}
  .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .pbtn{background:#0f1a13;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:14px 10px;font:inherit;font-size:15px;cursor:pointer;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbtn:hover{border-color:var(--acc);color:var(--acc)}
  .new{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  input{flex:1;min-width:160px;background:#0f1a13;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:16px}
  input:focus{outline:none;border-color:var(--acc)}
  button.main{background:var(--acc);color:#06240f;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  button.main:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font:inherit;font-size:14px;cursor:pointer}
  button.ghost:hover{border-color:var(--bad);color:var(--bad)}
  .who{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .who .n{font-size:26px;font-weight:700} .who .n small{font-size:13px;color:var(--mut);font-weight:400;margin-right:6px}
  .totals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
  .tot{background:#0f1a13;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tot .l{font-size:12px;color:var(--mut)} .tot .v{font-size:32px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .tot.miss .v{color:var(--warn)} .tot.hit .v{color:var(--acc)}
  .holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .hole{background:#0f1a13;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;transition:border-color .3s, box-shadow .3s}
  .ringbox{height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .ring{border-radius:50%;border:4px solid #2c4a37;background:radial-gradient(circle,#050806 55%,#0f1a13);transition:all .25s}
  .hole[data-id=small] .ring{width:44px;height:44px}
  .hole[data-id=medium] .ring{width:66px;height:66px}
  .hole[data-id=large] .ring{width:88px;height:88px}
  .hole .name{font-weight:600;font-size:14px} .hole .pts{font-size:12px;color:var(--mut);margin-top:2px}
  .hole .cnt{font-size:38px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .hole.hit{border-color:var(--acc);box-shadow:0 0 0 3px rgba(61,220,132,.25)}
  .hole.hit .ring{border-color:var(--acc);background:radial-gradient(circle,#3ddc84 0 20%,#050806 60%)}
  .shots{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .shots label{font-size:15px;width:100%}
  .shots input{max-width:180px;font-size:22px;font-weight:700;text-align:center}
  .hint{font-size:13px;color:var(--mut);margin-top:8px;min-height:18px}
  .hint.bad{color:var(--bad)}
  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .done{border-color:var(--acc)}
  .done .big{font-size:18px;margin-bottom:8px}
  .hidden{display:none}
  footer{text-align:center;padding:10px 0 26px}
  footer a{color:var(--mut);font-size:12px;text-decoration:none}
  @media (max-width:640px){.totals{grid-template-columns:repeat(2,1fr)}.holes{grid-template-columns:repeat(3,1fr)}.hole .cnt{font-size:28px}.ringbox{height:70px}.hole[data-id=large] .ring{width:64px;height:64px}.hole[data-id=medium] .ring{width:48px;height:48px}.hole[data-id=small] .ring{width:32px;height:32px}}
</style>
</head>
<body>
<header>
  <h1>ხვრელების <span>მთვლელი</span></h1>
  <div class="status">
    <span><i class="dot" id="netDot"></i><span id="netTxt">კავშირი…</span></span>
    <span><i class="dot" id="devDot"></i><span id="devTxt">დაფა: უცნობია</span></span>
  </div>
</header>
<main>
  <!-- შედეგი ბოლო თამაშის შემდეგ -->
  <div class="card done hidden" id="doneCard">
    <div class="big" id="doneTxt"></div>
    <button class="ghost" onclick="$('doneCard').classList.add('hidden')">დახურვა</button>
  </div>

  <!-- 1. მოთამაშის არჩევა -->
  <div class="card" id="pickCard">
    <h2>აირჩიე მოთამაშე</h2>
    <div class="players" id="players"></div>
    <div class="new">
      <input id="newName" maxlength="40" placeholder="ახალი მოთამაშის სახელი">
      <button class="main" id="newBtn">დაწყება</button>
    </div>
  </div>

  <!-- 2. თამაში -->
  <div class="card hidden" id="playCard">
    <div class="who"><div class="n"><small>თამაშობს:</small><span id="pName"></span></div></div>
    <div class="totals">
      <div class="tot hit"><div class="l">გაიტანა</div><div class="v" id="hits">0</div></div>
      <div class="tot miss"><div class="l">ააცილა</div><div class="v" id="misses">—</div></div>
      <div class="tot"><div class="l">სიზუსტე</div><div class="v" id="acc">—</div></div>
      <div class="tot"><div class="l">ქულა</div><div class="v" id="score">0</div></div>
    </div>
    <div class="holes">
      <div class="hole" data-id="small"><div class="ringbox"><div class="ring"></div></div><div class="name">პატარა</div><div class="pts" id="pts-small"></div><div class="cnt" id="c-small">0</div></div>
      <div class="hole" data-id="medium"><div class="ringbox"><div class="ring"></div></div><div class="name">საშუალო</div><div class="pts" id="pts-medium"></div><div class="cnt" id="c-medium">0</div></div>
      <div class="hole" data-id="large"><div class="ringbox"><div class="ring"></div></div><div class="name">დიდი</div><div class="pts" id="pts-large"></div><div class="cnt" id="c-large">0</div></div>
    </div>
    <div class="shots" style="margin-top:18px">
      <label for="shots">სულ რამდენჯერ დაარტყი?</label>
      <input id="shots" type="number" min="0" inputmode="numeric" placeholder="0">
    </div>
    <div class="hint" id="hint">ჩაწერე დარტყმების რაოდენობა: აცილება = დარტყმა − გატანა.</div>
    <div class="actions">
      <button class="main" id="finishBtn">დასრულება და შენახვა</button>
      <button class="ghost" id="cancelBtn">გაუქმება</button>
    </div>
  </div>
</main>
<footer><a href="stats.html">🔒</a></footer>
<script>
// ====== უნდა ემთხვეოდეს ESP32-ის კოდში არსებულ MQTT_BASE-ს ======
const MQTT_BASE = "holecounter/80g10v5p";
const MQTT_URL  = "wss://broker.hivemq.com:8884/mqtt";
// ===================================================================
// ძველი სისტემის (Third Zone, 192.168.0.147) მოთამაშეები — სიაში რომ გამოჩნდნენ
const OLD_PLAYERS = ["WildYak_801","SwiftYak_325","EagerWolf_163","SilentFox_353","CoolBison_586","BoldBison_157","SwiftPanda_160","RapidLynx_837","RapidYak_573","WildCrane_667"];

const $ = id => document.getElementById(id);
const LOCAL = location.protocol.startsWith("http") && !location.hostname.endsWith("github.io");
let state = null, lastSeq = -1, espPlayers = [];

function setDot(el, txtEl, st, txt){ el.className = "dot " + st; txtEl.textContent = txt; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ბრძანება ESP32-ს: ინტერნეტით (MQTT) ან, თუ გვერდი ESP32-დან გაიხსნა, პირდაპირ
async function send(cmd){
  if (client && client.connected) { client.publish(MQTT_BASE+"/cmd", cmd); return true; }
  if (LOCAL) { try { await fetch("/api/cmd", {method:"POST", body:new URLSearchParams({c:cmd})}); pollOnce(); return true; } catch(e){} }
  alert("დაფასთან კავშირი არ არის. სცადე თავიდან.");
  return false;
}

function drawPlayers(){
  const all = [...espPlayers, ...OLD_PLAYERS.filter(p => !espPlayers.includes(p))];
  $("players").innerHTML = all.map(p => '<button class="pbtn" data-p="'+esc(p)+'">'+esc(p)+'</button>').join("");
}
$("players").onclick = e => { const b = e.target.closest(".pbtn"); if (b) start(b.dataset.p); };
$("newBtn").onclick = () => { const n = $("newName").value.trim(); if (n) start(n); else $("newName").focus(); };
$("newName").onkeydown = e => { if (e.key === "Enter") $("newBtn").click(); };

async function start(name){
  name = name.replace(/["\\\n\r\t]/g, "").trim().slice(0, 40);
  if (!name) return;
  if (state && state.player && !confirm(state.player + "-ის თამაში ჯერ არ დასრულებულა. გაუქმდეს და დაიწყოს ახალი?")) return;
  if (await send("start:" + name)) { $("newName").value = ""; $("shots").value = ""; }
}

function hitsNow(){ return state ? (state.total || 0) : 0; }
function updateMiss(){
  const h = hitsNow(), v = $("shots").value.trim(), n = parseInt(v, 10);
  $("hits").textContent = h;
  if (v === "" || isNaN(n)) { $("misses").textContent = "—"; $("acc").textContent = "—"; $("hint").className = "hint"; $("hint").textContent = "ჩაწერე დარტყმების რაოდენობა: აცილება = დარტყმა − გატანა."; return; }
  if (n < h) { $("misses").textContent = "—"; $("acc").textContent = "—"; $("hint").className = "hint bad"; $("hint").textContent = "დარტყმა გატანაზე (" + h + ") ნაკლები ვერ იქნება."; return; }
  $("misses").textContent = n - h;
  $("acc").textContent = n ? Math.round(h * 100 / n) + "%" : "—";
  $("hint").className = "hint"; $("hint").textContent = n + " დარტყმა: " + h + " გაიტანა, " + (n - h) + " ააცილა.";
}
$("shots").oninput = updateMiss;

$("finishBtn").onclick = async () => {
  const h = hitsNow(), n = parseInt($("shots").value, 10);
  if (isNaN(n)) { $("hint").className = "hint bad"; $("hint").textContent = "ჯერ ჩაწერე, სულ რამდენჯერ დაარტყი."; $("shots").focus(); return; }
  if (n < h) { updateMiss(); return; }
  const who = state.player, sc = state.score || 0;
  if (await send("finish:" + n)) {
    $("doneTxt").textContent = who + ": " + n + " დარტყმა · " + h + " გაიტანა · " + (n - h) + " ააცილა · " + (n ? Math.round(h*100/n) : 0) + "% · " + sc + " ქულა. შენახულია ✔";
    $("doneCard").classList.remove("hidden");
    $("shots").value = "";
  }
};
$("cancelBtn").onclick = () => { if (confirm("თამაში გაუქმდეს? შედეგი არ შეინახება.")) { send("cancel"); $("shots").value = ""; } };

function flash(id){
  const el = document.querySelector('.hole[data-id="'+id+'"]');
  if (!el) return;
  el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 900);
}

function render(s){
  if (!s || typeof s !== "object") return;
  state = s;
  for (const h of (s.holes || [])) {
    if ($("c-"+h.id)) $("c-"+h.id).textContent = h.count;
    if ($("pts-"+h.id)) $("pts-"+h.id).textContent = h.points + " ქულა";
  }
  $("score").textContent = s.score ?? 0;
  if (typeof s.seq === "number" && s.seq !== lastSeq) {
    if (lastSeq !== -1 && s.seq > lastSeq && s.last && s.total > 0) flash(s.last);
    lastSeq = s.seq;
  }
  const playing = !!s.player;
  $("pickCard").classList.toggle("hidden", playing);
  $("playCard").classList.toggle("hidden", !playing);
  if (playing) $("pName").textContent = s.player;
  updateMiss();
}

// ---- MQTT (მუშაობს ნებისმიერი ადგილიდან) ----
let client = null;
if (window.mqtt) {
  client = mqtt.connect(MQTT_URL, {clientId:"web-"+Math.random().toString(16).slice(2,10), reconnectPeriod:3000, connectTimeout:8000});
  client.on("connect", () => { setDot($("netDot"), $("netTxt"), "ok", "ონლაინ"); client.subscribe([MQTT_BASE+"/state", MQTT_BASE+"/status", MQTT_BASE+"/players"]); });
  client.on("reconnect", () => setDot($("netDot"), $("netTxt"), "wait", "ვუკავშირდები…"));
  client.on("offline", () => setDot($("netDot"), $("netTxt"), "", "ოფლაინ"));
  client.on("message", (topic, msg) => {
    const sub = topic.slice(MQTT_BASE.length + 1), txt = msg.toString();
    if (sub === "state") { try { render(JSON.parse(txt)); } catch(e){} }
    else if (sub === "players") { try { espPlayers = JSON.parse(txt || "[]"); drawPlayers(); } catch(e){} }
    else if (sub === "status") {
      txt === "online" ? setDot($("devDot"), $("devTxt"), "ok", "დაფა: ჩართულია")
                       : setDot($("devDot"), $("devTxt"), "", "დაფა: გამორთულია");
    }
  });
} else {
  setDot($("netDot"), $("netTxt"), "", "MQTT ბიბლიოთეკა ვერ ჩაიტვირთა");
}

// ---- ლოკალური რეჟიმი: თუ გვერდი პირდაპირ ESP32-დან გაიხსნა (ინტერნეტის გარეშეც მუშაობს) ----
async function pollOnce(){
  try {
    const r = await fetch("/api/state", {cache:"no-store"});
    if (!r.ok) return false;
    render(await r.json());
    if (!client || !client.connected) setDot($("devDot"), $("devTxt"), "ok", "დაფა: ჩართულია (ლოკალურად)");
    return true;
  } catch(e) { return false; }
}
async function pollLocal(){ if (await pollOnce()) setTimeout(pollLocal, 400); }
if (LOCAL) {
  pollLocal();
  fetch("/api/players").then(r => r.json()).then(p => { espPlayers = p; drawPlayers(); }).catch(() => {});
}
drawPlayers();
</script>
</body>
</html>
