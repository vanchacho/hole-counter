<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>თამაშების ისტორია</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root{--bg:#0d1410;--card:#15201a;--line:#24342a;--txt:#e8f1ea;--mut:#8aa293;--acc:#3ddc84;--warn:#ffb020;--bad:#ff5a5a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  h1 span{color:var(--acc)}
  .status{display:flex;gap:14px;font-size:13px;color:var(--mut);flex-wrap:wrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--acc)} .dot.wait{background:var(--warn)}
  nav a{color:var(--acc);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:7px 12px}
  nav a:hover{border-color:var(--acc)}
  main{max-width:980px;margin:0 auto;padding:22px}
  .totals{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .tot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .tot .l{font-size:13px;color:var(--mut)} .tot .v{font-size:32px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:10px 14px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:12px;border-top:0}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  td.score{color:var(--acc);font-weight:700}
  tr.best td.score::after{content:" ★";color:var(--warn)}
  .empty{color:var(--mut);text-align:center;padding:22px}
  @media (max-width:640px){.totals{grid-template-columns:repeat(2,1fr)}.tot .v{font-size:26px}}
</style>
</head>
<body>
<header>
  <h1>თამაშების <span>ისტორია</span></h1>
  <nav><a href="index.html">← მთვლელი</a></nav>
  <div class="status">
    <span><i class="dot" id="netDot"></i><span id="netTxt">კავშირი…</span></span>
  </div>
</header>
<main>
  <div class="totals">
    <div class="tot"><div class="l">თამაში</div><div class="v" id="games">0</div></div>
    <div class="tot"><div class="l">სულ მოხვედრა</div><div class="v" id="hits">0</div></div>
    <div class="tot"><div class="l">საუკეთესო ქულა</div><div class="v" id="best">0</div></div>
    <div class="tot"><div class="l">საშუალო ქულა</div><div class="v" id="avg">0</div></div>
  </div>
  <div class="wrap">
    <table>
      <thead><tr><th>#</th><th>თარიღი</th><th>ხანგრძლივობა</th><th>პატარა</th><th>საშუალო</th><th>დიდი</th><th>სულ</th><th>ქულა</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">ისტორია იტვირთება…</td></tr></tbody>
    </table>
  </div>
</main>
<script>
// ====== უნდა ემთხვეოდეს ESP32-ის კოდში არსებულ MQTT_BASE-ს ======
const MQTT_BASE = "holecounter/80g10v5p";
const MQTT_URL  = "wss://broker.hivemq.com:8884/mqtt";
// ===================================================================
const $ = id => document.getElementById(id);

function setDot(state, txt){ $("netDot").className = "dot " + state; $("netTxt").textContent = txt; }

function fmtDate(t){
  if (!t) return "—";
  return new Date(t * 1000).toLocaleString("ka-GE", {year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
}
function fmtDur(g){
  if (!g.start || !g.end || g.end < g.start) return "—";
  const s = g.end - g.start, m = Math.floor(s / 60);
  return m ? m + " წთ " + (s % 60) + " წმ" : s + " წმ";
}

function render(list){
  if (!Array.isArray(list)) return;
  const games = list.length;
  const hits = list.reduce((a, g) => a + (g.total || 0), 0);
  const best = list.reduce((a, g) => Math.max(a, g.score || 0), 0);
  $("games").textContent = games;
  $("hits").textContent = hits;
  $("best").textContent = best;
  $("avg").textContent = games ? Math.round(list.reduce((a, g) => a + (g.score || 0), 0) / games) : 0;

  if (!games) { $("rows").innerHTML = '<tr><td colspan="8" class="empty">ჯერ არცერთი თამაში არ შენახულა. მთავარ გვერდზე „დასრულება და განულება“ შედეგს აქ შეინახავს.</td></tr>'; return; }
  // უახლესი ზემოთ
  $("rows").innerHTML = list.map((g, i) => ({g, n: i + 1})).reverse().map(({g, n}) =>
    '<tr' + (g.score === best && best > 0 ? ' class="best"' : '') + '>' +
    '<td>' + n + '</td><td>' + fmtDate(g.end || g.start) + '</td><td>' + fmtDur(g) + '</td>' +
    '<td>' + (g.small || 0) + '</td><td>' + (g.medium || 0) + '</td><td>' + (g.large || 0) + '</td>' +
    '<td>' + (g.total || 0) + '</td><td class="score">' + (g.score || 0) + '</td></tr>').join("");
}

// ---- MQTT (მუშაობს ნებისმიერი ადგილიდან) ----
let client = null, gotHistory = false;
if (window.mqtt) {
  client = mqtt.connect(MQTT_URL, {clientId:"webh-"+Math.random().toString(16).slice(2,10), reconnectPeriod:3000, connectTimeout:8000});
  client.on("connect", () => { setDot("ok", "ონლაინ"); client.subscribe(MQTT_BASE+"/history"); });
  client.on("reconnect", () => setDot("wait", "ვუკავშირდები…"));
  client.on("offline", () => setDot("", "ოფლაინ"));
  client.on("message", (topic, msg) => {
    if (topic !== MQTT_BASE+"/history") return;
    try { gotHistory = true; render(JSON.parse(msg.toString() || "[]")); } catch(e){}
  });
  // retained შეტყობინება თუ არ მოვიდა, ესე იგი ისტორია ჯერ ცარიელია
  setTimeout(() => { if (!gotHistory && client.connected) render([]); }, 5000);
} else {
  setDot("", "MQTT ბიბლიოთეკა ვერ ჩაიტვირთა");
}

// ---- ლოკალური რეჟიმი: თუ გვერდი პირდაპირ ESP32-დან გაიხსნა ----
async function loadLocal(){
  try {
    const r = await fetch("/api/history", {cache:"no-store"});
    if (!r.ok) return;
    gotHistory = true;
    render(await r.json());
  } catch(e) {}
}
if (location.protocol.startsWith("http") && !location.hostname.endsWith("github.io")) loadLocal();
</script>
</body>
</html>
